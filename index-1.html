<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RA Web Studio | Links</title>
<meta name="description" content="RA Web Studio — Web Designer & Digital Creative. Portfolio, Wedding Planner, Digital Products, and WhatsApp.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08090d;--card:rgba(255,255,255,.065);--border:rgba(255,255,255,.11);--text:#f7f7f8;--muted:#a8abb5;--accent:#fff}
body{
  min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);background:
  radial-gradient(circle at 50% 0%,rgba(255,255,255,.12),transparent 32%),
  radial-gradient(circle at 10% 90%,rgba(110,110,255,.08),transparent 28%),var(--bg);
  display:flex;justify-content:center;padding:42px 18px;
}
.wrap{width:100%;max-width:520px;text-align:center}
.avatar{
  width:82px;height:82px;margin:0 auto 18px;border-radius:50%;
  display:grid;place-items:center;background:linear-gradient(145deg,#fff,#9b9da5);
  color:#0b0c10;font-size:25px;font-weight:900;letter-spacing:-1px;
  box-shadow:0 14px 45px rgba(255,255,255,.12);
}
h1{font-size:27px;letter-spacing:-.7px;margin-bottom:7px}
.tagline{color:var(--muted);font-size:14px;margin-bottom:27px}
.links{display:grid;gap:13px}
a{
  position:relative;display:flex;align-items:center;justify-content:center;min-height:62px;
  padding:15px 48px 15px 20px;border:1px solid var(--border);border-radius:17px;
  background:var(--card);color:var(--text);text-decoration:none;font-weight:700;font-size:15px;
  backdrop-filter:blur(14px);transition:.22s ease;overflow:hidden;
}
a:before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.07),transparent);transform:translateX(-110%);transition:.5s}
a:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.095)}
a:hover:before{transform:translateX(110%)}
.icon{position:absolute;left:19px;font-size:19px}
.arrow{position:absolute;right:19px;color:#aeb1ba;font-size:19px}
.primary{background:#f4f4f5;color:#08090d;border-color:#f4f4f5}
.primary:hover{background:#fff}
.primary .arrow{color:#555}
.divider{height:1px;background:var(--border);margin:27px 0 20px}
.small{color:#8e919b;font-size:12px}
footer{margin-top:12px;color:#6f727c;font-size:11px}
@media(max-width:390px){body{padding-top:28px}.avatar{width:74px;height:74px}h1{font-size:24px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="avatar">RA</div>
  <h1>RA Web Studio</h1>
  <p class="tagline">Web Designer • Digital Creative</p>

  <section class="links">
    <a class="primary" href="https://ra-web-studio-showcase.lovable.app" target="_blank" rel="noopener">
      <span class="icon">🌐</span>Portfolio Website<span class="arrow">↗</span>
    </a>
    <a href="https://ra-wedding-planner.lovable.app" target="_blank" rel="noopener">
      <span class="icon">💍</span>RA Wedding Planner<span class="arrow">↗</span>
    </a>
    <a href="https://lynk.id/raflyarifha" target="_blank" rel="noopener">
      <span class="icon">🔗</span>My Links & Digital Products<span class="arrow">↗</span>
    </a>
    <a href="https://wa.me/6281286945398?text=Halo%20RA%20Web%20Studio%2C%20saya%20ingin%20konsultasi." target="_blank" rel="noopener">
      <span class="icon">💬</span>Chat via WhatsApp<span class="arrow">↗</span>
    </a>
  </section>

  <div class="divider"></div>
  <p class="small">Creating modern digital experiences for brands & businesses.</p>
  <footer>© 2026 RA Web Studio</footer>
</main>
</body>
</html>
